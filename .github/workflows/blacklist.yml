name: Blacklist

# A mod labels an issue: "approved" (submission → added), "denied" (closed), "remove" (player taken off).
# Only people with Triage access or more can add labels, and the script checks that again.

on:
  issues:
    types: [labeled]

permissions:
  contents: write
  issues: write

concurrency:
  group: blacklist
  cancel-in-progress: false

jobs:
  apply:
    if: contains(fromJSON('["approved", "denied", "remove"]'), github.event.label.name)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node .github/scripts/apply.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
