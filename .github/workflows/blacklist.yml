name: Blacklist

# A mod labels an issue: "approved" (submission → added), "denied" (closed), "remove" (player taken off).
# Only people with Triage access or more can add labels, and the script checks that again.
# Third-party actions are pinned to exact commits (v4.4.0) so a moved tag can't change what runs here.

on:
  issues:
    types: [labeled]

permissions:
  contents: write
  issues: write

concurrency:
  group: blacklist
  cancel-in-progress: false

jobs:
  apply:
    if: contains(fromJSON('["approved", "denied", "remove"]'), github.event.label.name)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
      - run: node .github/scripts/apply.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
